# SPRING_PROFILES_ACTIVE=prod 일 때만 읽힌다. 값은 CloudType 환경변수로 넣는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.h2.console.enabled=false
spring.jpa.show-sql=false

# MariaDB 같은 외부 DB는 기본으로 data.sql을 실행하지 않는다. 직접 켜고 MariaDB용 파일을 지정한다.
# INSERT IGNORE라서 재시작해도 중복 오류 없이 이미 있는 행은 건너뛴다.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-mariadb.sql
